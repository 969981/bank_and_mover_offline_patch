name: official-bank-recovery-b-ci

on:
  push:
    branches:
      - feature/official-bank-recovery-smart
  workflow_dispatch:

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Direct CIA extraction helpers
        run: |
          cd bank/tools
          python test_extract_bank_cia.py -v

      - name: Recovery hook-site verifier
        run: |
          cd bank/tools
          python test_verify_recovery_hook_sites.py -v

      - name: Staged recovery marker research regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_recovery_marker_host_test.c \
            bank/src/official_recovery_marker_core.c \
            -o /tmp/marker_test
          /tmp/marker_test

      - name: Smart recovery policy research regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_recovery_smart_host_test.c \
            bank/src/official_recovery_smart_core.c \
            bank/src/official_recovery_marker_core.c \
            -o /tmp/smart_policy_test
          /tmp/smart_policy_test

      - name: Smart runtime research regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_recovery_smart_runtime_host_test.c \
            bank/src/official_recovery_smart_runtime_core.c \
            bank/src/official_recovery_smart_core.c \
            bank/src/official_recovery_marker_io_core.c \
            bank/src/official_recovery_marker_core.c \
            -o /tmp/smart_runtime_test
          /tmp/smart_runtime_test

      - name: Existing stock recovery model
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_recovery_probe_host_test.c \
            bank/src/official_recovery_probe_core.c \
            -o /tmp/probe_test
          /tmp/probe_test

      - name: Existing bulk sync regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_bulk_sync_host_test.c \
            bank/src/official_bulk_sync_core.c \
            -o /tmp/bulk_test
          /tmp/bulk_test

      - name: Verify smart production ARM payload budget
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
          FLAGS='-std=c11 -Os -march=armv6k -mtune=mpcore -mthumb -mfloat-abi=soft -ffreestanding -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer -fno-common -ffunction-sections -fdata-sections -Wall -Wextra -Werror'
          arm-none-eabi-gcc $FLAGS -c bank/src/official_bulk_sync_prod.c -o /tmp/smart-prod.o
          echo '=== production Thumb object ==='
          arm-none-eabi-size /tmp/smart-prod.o
          test "$(arm-none-eabi-size /tmp/smart-prod.o | awk 'NR==2 {print $1}')" -eq 1577

          cat >/tmp/recovery-b-tail.s <<'EOF'
          .syntax unified
          .cpu mpcore
          .arm
          .text
          .global recovery_b_pre_stage
          recovery_b_pre_stage:
              ldrb r1,[r4,#0x48]
              cmp r1,#8
              beq 1f
              mov r1,#7
              strb r1,[r4,#0x48]
              mov r0,#7
              b 9f
          1:
              mov r1,#0
              strb r1,[r4,#0x48]
              mov r0,r4
              bl 8f
              b 9f
          .global recovery_b_after_journal
          recovery_b_after_journal:
              ldrb r1,[r4,#0x48]
              cmp r1,#7
              bne 3f
              cmp r0,#1
              bne 4f
              mov r1,#8
              strb r1,[r4,#0x48]
              mov r0,#1
              b 9f
          4:
              mov r1,#0
              strb r1,[r4,#0x48]
              mov r0,#20
              b 9f
          3:
              cmp r0,#1
              b 9f
          .global recovery_b_local_clear
          recovery_b_local_clear:
              mov r1,#0
              strb r1,[r4,#0x88]
              b 8f
          .global recovery_b_game_mismatch
          recovery_b_game_mismatch:
              ldrb r0,[r4,#0x88]
              cmp r0,#2
              moveq r0,#6
              movne r0,#8
              str r0,[r4,#0x10]
              b 8f
          8:
              bx lr
          9:
              b 9b
          EOF
          arm-none-eabi-as -mcpu=mpcore /tmp/recovery-b-tail.s -o /tmp/recovery-b-tail.o
          arm-none-eabi-objcopy -O binary -j .text /tmp/recovery-b-tail.o /tmp/recovery-b-tail.bin
          echo '=== Recovery B tail shims ==='
          arm-none-eabi-objdump -d /tmp/recovery-b-tail.o
          # Exclude the two 4-byte dummy terminal labels (8 bytes) used only to
          # make this standalone CI assembly linkable: 152 - 8 = 144 real bytes.
          test "$(( $(stat -c %s /tmp/recovery-b-tail.bin) - 8 ))" -eq 144

          cat >/tmp/recovery-b-inline.s <<'EOF'
          .syntax unified
          .cpu mpcore
          .arm
          .text
          inline_local_status:
              cmp r0,#1
              bne 1f
              mov r1,#2
              strb r1,[r4,#0x88]
              b 2f
          1:
              cmp r0,#2
              beq 3f
              b 4f
          2:
          3:
          4:
          EOF
          arm-none-eabi-as -mcpu=mpcore /tmp/recovery-b-inline.s -o /tmp/recovery-b-inline.o
          arm-none-eabi-objcopy -O binary -j .text /tmp/recovery-b-inline.o /tmp/recovery-b-inline.bin
          test "$(stat -c %s /tmp/recovery-b-inline.bin)" -eq 32

          # RX tail = 0x6F0 = 1776.  V3 object 1577 + existing dispatch 36 +
          # Recovery B tail 144 = 1757, leaving 19 bytes of mapped RX tail.
          test $((1577 + 36 + 144)) -le 1776
