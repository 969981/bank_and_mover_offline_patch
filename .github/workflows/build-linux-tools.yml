name: build-linux-tools

on:
  workflow_dispatch:
  push:
    branches:
      - research/saveboxes-transaction-analysis
    paths:
      - .github/workflows/build-linux-tools.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build armips v0.11.0
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive --branch v0.11.0 --depth 1 https://github.com/Kingcom/armips.git "$RUNNER_TEMP/armips"
          cmake -S "$RUNNER_TEMP/armips" -B "$RUNNER_TEMP/armips/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/armips/build"

      - name: Build Floating IPS CLI
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Alcaro/Flips.git "$RUNNER_TEMP/flips"
          make -C "$RUNNER_TEMP/flips" TARGET=cli CFLAGS=-O2

      - name: Collect tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/tools-out"
          cp "$RUNNER_TEMP/armips/build/armips" "$RUNNER_TEMP/tools-out/armips"
          cp "$RUNNER_TEMP/flips/flips" "$RUNNER_TEMP/tools-out/flips"
          chmod +x "$RUNNER_TEMP/tools-out/armips" "$RUNNER_TEMP/tools-out/flips"
          "$RUNNER_TEMP/tools-out/armips" 2>&1 | head -20 || true
          "$RUNNER_TEMP/tools-out/flips" --help | head -20
          sha256sum "$RUNNER_TEMP/tools-out/armips" "$RUNNER_TEMP/tools-out/flips"

      - name: Upload Linux build helpers
        uses: actions/upload-artifact@v4
        with:
          name: bank-linux-build-tools
          path: ${{ runner.temp }}/tools-out/
          if-no-files-found: error
          retention-days: 1
