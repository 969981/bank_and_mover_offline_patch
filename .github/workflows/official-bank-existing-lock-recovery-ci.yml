name: official-bank-existing-lock-recovery-ci

on:
  push:
    branches:
      - feature/official-bank-existing-lock-recovery
  workflow_dispatch:

jobs:
  host-and-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recovery C host regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_existing_lock_recovery_host_test.c \
            bank/src/official_existing_lock_recovery_core.c \
            -o /tmp/recovery-c-test
          /tmp/recovery-c-test

      - name: Existing stock recovery model regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_recovery_probe_host_test.c \
            bank/src/official_recovery_probe_core.c \
            -o /tmp/probe-test
          /tmp/probe-test

      - name: Existing bulk sync regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_bulk_sync_host_test.c \
            bank/src/official_bulk_sync_core.c \
            -o /tmp/bulk-test
          /tmp/bulk-test

      - name: Static verifier syntax
        run: python -m py_compile bank/src/verify_official_bulk_sync.py

      - name: Compile Recovery C production objects and enforce RX-tail budget
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
          mkdir -p bank/build
          FLAGS='-std=c11 -Os -march=armv6k -mtune=mpcore -mthumb -mfloat-abi=soft -ffreestanding -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer -fno-common -ffunction-sections -fdata-sections -Wall -Wextra -Werror'
          arm-none-eabi-gcc $FLAGS -c bank/src/official_bulk_sync_prod.c -o bank/build/official_bulk_sync_prod.o
          arm-none-eabi-as -mcpu=mpcore bank/src/official_existing_lock_recovery_arm.s -o bank/build/official_existing_lock_recovery_arm.o

          arm-none-eabi-objcopy -O binary -j .text \
            bank/build/official_existing_lock_recovery_arm.o \
            /tmp/recovery-c.bin
          PROD_SIZE=$(arm-none-eabi-size bank/build/official_bulk_sync_prod.o | awk 'NR==2 {print $1}')
          C_SIZE=$(stat -c %s /tmp/recovery-c.bin)
          # 36-byte Bulk dispatcher + 36-byte C4 state17 status helper.
          GLUE_SIZE=72
          TOTAL=$((PROD_SIZE + GLUE_SIZE + C_SIZE))
          echo "RX tail budget: bulk=${PROD_SIZE} armips_glue=${GLUE_SIZE} recovery_c=${C_SIZE} total=${TOTAL}/1776"
          test "$TOTAL" -le 1776

          echo '=== Recovery C4 ARM shim ==='
          arm-none-eabi-objdump -d bank/build/official_existing_lock_recovery_arm.o | tee /tmp/recovery-c.dis
          grep -Eq 'mov[[:space:]]+r2, *#3' /tmp/recovery-c.dis
          grep -Eq 'ldrd' /tmp/recovery-c.dis
          test -z "$(arm-none-eabi-nm -u bank/build/official_existing_lock_recovery_arm.o)"

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-c-production-objects
          path: |
            bank/build/official_bulk_sync_prod.o
            bank/build/official_existing_lock_recovery_arm.o
          if-no-files-found: error

  armips-smoke:
    needs: host-and-budget
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recovery-c-production-objects
          path: bank/build

      - name: Prepare synthetic verified-layout baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bank/rom/exefs | Out-Null
          $path = 'bank/rom/exefs/00040000000C9B00.dec.code'
          $fs = [System.IO.File]::Open($path, [System.IO.FileMode]::Create)
          try { $fs.SetLength(0x2AC000) } finally { $fs.Dispose() }

      - name: Assemble production main_official.s with armips
        shell: pwsh
        working-directory: bank/src
        run: |
          ../tools/armips/armips.exe -erroronwarning -stat -sym ../build/official-armips-symbols-smoke.txt main_official.s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patched = '../build/00040000000C9B00.dec.code'
          if (-not (Test-Path $patched)) { throw 'armips did not create patched image' }
          if ((Get-Item $patched).Length -ne 0x2AC000) { throw 'patched image size changed' }

      - name: Verify linked Recovery C4 symbols and branch targets
        shell: pwsh
        run: |
          $text = Get-Content bank/build/official-armips-symbols-smoke.txt -Raw
          foreach ($name in @(
            'OfficialBulk_BankDataSyncDispatch',
            'OfficialExistingLock_State17Status',
            'OfficialExistingLock_GameMismatch',
            'OfficialBulkSync_Process'
          )) {
            if ($text -notmatch [regex]::Escape($name)) { throw "missing symbol: $name" }
          }

          $gameMatch = [regex]::Match($text, '(?im)^([0-9A-Fa-f]{8})\s+officialexistinglock_gamemismatch\s*$')
          if (-not $gameMatch.Success) { throw 'cannot resolve OfficialExistingLock_GameMismatch' }
          $gameHelper = [Convert]::ToInt64($gameMatch.Groups[1].Value,16)

          $statusMatch = [regex]::Match($text, '(?im)^([0-9A-Fa-f]{8})\s+officialexistinglock_state17status\s*$')
          if (-not $statusMatch.Success) { throw 'cannot resolve OfficialExistingLock_State17Status' }
          $statusHelper = [Convert]::ToInt64($statusMatch.Groups[1].Value,16)

          $bytes = [System.IO.File]::ReadAllBytes('bank/build/00040000000C9B00.dec.code')
          $bulkOff = 0x002AF460 - 0x00100000
          if ([BitConverter]::ToUInt32($bytes,$bulkOff) -eq 0) { throw 'BankDataSync hook remained zero' }

          foreach ($va in @(0x002A89D0,0x002A89E0)) {
            $off = $va - 0x00100000
            $word = [BitConverter]::ToUInt32($bytes,$off)
            if (($word -shr 24) -ne 0x1A) {
              throw ('expected ARM BNE at 0x{0:X8}, got 0x{1:X8}' -f $va,$word)
            }
            $imm = [int64]($word -band 0x00FFFFFF)
            if (($imm -band 0x00800000) -ne 0) { $imm -= 0x01000000 }
            $target = [int64]$va + 8 + ($imm * 4)
            if ($target -ne $gameHelper) {
              throw ('BNE target mismatch at 0x{0:X8}: target=0x{1:X8} helper=0x{2:X8}' -f $va,$target,$gameHelper)
            }
          }

          $va = 0x002A9518
          $off = $va - 0x00100000
          $word = [BitConverter]::ToUInt32($bytes,$off)
          if (($word -shr 24) -ne 0xEA) {
            throw ('expected ARM B at state17 status hook, got 0x{0:X8}' -f $word)
          }
          $imm = [int64]($word -band 0x00FFFFFF)
          if (($imm -band 0x00800000) -ne 0) { $imm -= 0x01000000 }
          $target = [int64]$va + 8 + ($imm * 4)
          if ($target -ne $statusHelper) {
            throw ('state17 status target mismatch: target=0x{0:X8} helper=0x{1:X8}' -f $target,$statusHelper)
          }

          # C4 case5: marker check, preserve transactionPassword only for C4,
          # then direct-call the stock state17 game-save start method.
          $checks = @{
            0x002A61C8 = 'E3A01701'
            0x002A61CC = 'E5801060'
            0x002A95F0 = 'E5D42062'
            0x002A95F4 = 'E3520003'
            0x002A95F8 = '0A000002'
            0x002A9600 = 'E5801008'
            0x002A9604 = 'E580100C'
            0x002A966C = 'E5D40062'
            0x002A970C = 'E3A0100C'
          }
          foreach ($entry in $checks.GetEnumerator()) {
            $off = [int64]$entry.Key - 0x00100000
            $actual = [BitConverter]::ToUInt32($bytes,$off)
            $expected = [Convert]::ToUInt32([string]$entry.Value,16)
            if ($actual -ne $expected) {
              throw ('machine-code mismatch at 0x{0:X8}: got=0x{1:X8} expected=0x{2:X8}' -f $entry.Key,$actual,$expected)
            }
          }

          $va = 0x002A9610
          $off = $va - 0x00100000
          $word = [BitConverter]::ToUInt32($bytes,$off)
          if (($word -shr 24) -ne 0xEB) { throw ('expected BL at C4 save call, got 0x{0:X8}' -f $word) }
          $imm = [int64]($word -band 0x00FFFFFF)
          if (($imm -band 0x00800000) -ne 0) { $imm -= 0x01000000 }
          $target = [int64]$va + 8 + ($imm * 4)
          if ($target -ne 0x002B4AB4) {
            throw ('C4 save call target mismatch: target=0x{0:X8}' -f $target)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-c-linked-template
          path: |
            bank/build/00040000000C9B00.dec.code
            bank/build/official-armips-symbols-smoke.txt
          if-no-files-found: error
