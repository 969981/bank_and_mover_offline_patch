name: release-official-bulk-sync-v3

on:
  push:
    branches:
      - feature/official-bank-bulk-sync
    paths:
      - .github/workflows/release-official-bulk-sync-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: official-bulk-sync-v3-preview-20260919
      TARGET_COMMIT: c4aa655637f96a9620299140cbded23a0f8da044
      IPS_SHA256: 9D17E1126316878497E07D1D1234860227B031EB26A9B9100C82B24806E3BDEE
      ZIP_SHA256: C0B3406A2E1EB8294C48B4A0816EE2CBADCEB4C605667E0C30D8A687D86A0E8E
      ZIP_NAME: PokemonBank_OfficialBulkSync_V3_interwork_fix_20260919.zip
    steps:
      - uses: actions/checkout@v4

      - name: Decode release payloads
        run: |
          base64 -d .github/release-payloads/official-bulk-sync-v3-code.ips.b64 > code.ips
          base64 -d .github/release-payloads/official-bulk-sync-v3-package.zip.b64 > "$ZIP_NAME"

      - name: Verify release payload hashes
        run: |
          actual_ips=$(sha256sum code.ips | awk '{print toupper($1)}')
          actual_zip=$(sha256sum "$ZIP_NAME" | awk '{print toupper($1)}')
          echo "code.ips: $actual_ips"
          echo "$ZIP_NAME: $actual_zip"
          test "$actual_ips" = "$IPS_SHA256"
          test "$actual_zip" = "$ZIP_SHA256"
          printf '%s  %s\n%s  %s\n' "$IPS_SHA256" code.ips "$ZIP_SHA256" "$ZIP_NAME" > SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > RELEASE.md <<'EOF'
          # Pokémon Bank v1.5 Official Bulk Sync V3 Preview

          Experimental prerelease for the `feature/official-bank-bulk-sync` branch.

          ## V3 architecture

          - Keeps the stock Pokémon Bank login, game selection, Bank UI, save/upload transaction and HOME flow.
          - Uses a single hook at `BankDataSyncState_Update` (`0x002AF460`).
          - Keeps all injected executable code inside the real RX text tail `0x00313910..0x00314000`.
          - Does **not** reuse mapped `.data` / BSS as a code cave.
          - Removes the V2 Thumb→ARM external helper relocation that caused `undefined instruction` at `PC=0x00313BB0`.
          - The ARM dispatcher obtains the TLS/FS command buffer and passes it to Thumb `OfficialBulkSync_Process(state, commandBuffer)`.
          - `bulk_import.bin` is read-only and supplies the main 100 Box Pokémon/Box data only.
          - Fresh server Bank data is backed up before applying bulk data.
          - Changed occupied slots receive stock-derived tag/source/timestamp metadata.
          - Stock `PrepareUpdate / HPP upload / CompleteUpdate / Rollback` remains untouched.

          ## Input

          `SD:/3ds/Bank/bulk_import.bin` may be either:

          - `0xACA48` PKHeX Bank7 compatible view; or
          - `0xBB518` current Pokémon Bank v1.5 image.

          Only the main 100 Box region is used as the bulk data source. Current-only server metadata is not trusted from the bulk file.

          ## Validation status

          Static/CI validation completed:

          - host merge/state-gating contract test
          - ARMv6K Thumb `-Werror` build
          - unexpected runtime-helper rejection
          - forbidden Thumb→ARM helper relocation rejection
          - RX text-tail size budget
          - armips assembly and IPS replay verification
          - mapped `.data` byte-for-byte preservation

          Real-device evidence so far:

          - the previous mapped-`.data` corruption was reproduced and fixed;
          - Sun/Moon/Ultra Sun/Ultra Moon game visibility recovered in V2;
          - V2 `undefined instruction` was traced to the bad cross-ISA relocation and removed in V3.

          **The official server Save → redownload round-trip is still experimental.** Validate in stages: H0 (no bulk) → H1 preview → 1 Pokémon round-trip → 30 → 300 → 3000.

          ## Installation

          Install only:

          `SD:/luma/titles/00040000000C9B00/code.ips`

          V3 does not require the old `romfs` directory. Remove old Scheme B / Offline preview `romfs` overrides when testing V3.

          ## Documentation

          See on the release target commit:

          - `bank/docs/official-bank-bulk-sync-principles-v3.zh-cn.md`
          - `bank/docs/official-bank-bulk-sync-technical-v3.zh-cn.md`
          - `bank/docs/official-bank-bulk-sync-design.zh-cn.md`
          - `bank/docs/saveboxes-transaction-analysis.zh-cn.md`

          ## SHA-256

          `code.ips`
          `9D17E1126316878497E07D1D1234860227B031EB26A9B9100C82B24806E3BDEE`

          `PokemonBank_OfficialBulkSync_V3_interwork_fix_20260919.zip`
          `C0B3406A2E1EB8294C48B4A0816EE2CBADCEB4C605667E0C30D8A687D86A0E8E`
          EOF

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --target "$TARGET_COMMIT" \
            --title "Pokémon Bank Official Bulk Sync V3 Preview" \
            --notes-file RELEASE.md \
            --prerelease \
            code.ips \
            "$ZIP_NAME" \
            SHA256SUMS.txt
