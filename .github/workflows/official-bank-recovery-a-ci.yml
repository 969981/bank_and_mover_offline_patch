name: official-bank-recovery-a-ci

on:
  push:
    branches:
      - feature/official-bank-recovery-auto-rollback
  workflow_dispatch:

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Direct CIA extraction helpers
        run: |
          cd bank/tools
          python test_extract_bank_cia.py -v

      - name: Recovery hook-site verifier
        run: |
          cd bank/tools
          python test_verify_recovery_hook_sites.py -v

      - name: Auto rollback policy
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_recovery_auto_rollback_host_test.c \
            bank/src/official_recovery_auto_rollback_core.c \
            -o /tmp/auto_policy_test
          /tmp/auto_policy_test

      - name: Auto rollback runtime model
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_recovery_runtime_host_test.c \
            bank/src/official_recovery_runtime_core.c \
            bank/src/official_recovery_auto_rollback_core.c \
            bank/src/official_recovery_probe_core.c \
            -o /tmp/auto_runtime_test
          /tmp/auto_runtime_test

      - name: Existing stock recovery model
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_recovery_probe_host_test.c \
            bank/src/official_recovery_probe_core.c \
            -o /tmp/probe_test
          /tmp/probe_test

      - name: Existing bulk sync regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            bank/src/official_bulk_sync_host_test.c \
            bank/src/official_bulk_sync_core.c \
            -o /tmp/bulk_test
          /tmp/bulk_test

      - name: Verify ARM production payload and A shim
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
          BASEFLAGS='-std=c11 -Os -march=armv6k -mtune=mpcore -mthumb -mfloat-abi=soft -ffreestanding -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer -fno-common -ffunction-sections -fdata-sections -Wall -Wextra -Werror'
          arm-none-eabi-gcc $BASEFLAGS -c bank/src/official_bulk_sync_prod.c -o /tmp/prod-default.o
          echo '=== production Thumb object ==='
          arm-none-eabi-size /tmp/prod-default.o
          test "$(arm-none-eabi-size /tmp/prod-default.o | awk 'NR==2 {print $1}')" -eq 1577
          cat >/tmp/recovery-a.s <<'EOF'
          .syntax unified
          .cpu mpcore
          .arm
          .text
          .global recovery_a_shim
          recovery_a_shim:
              ldr r0,[r4,#0x28]
              add r1,r4,#0x40
              ldmia r0!,{r2,r3,r5-r7,r12}
              stmia r1!,{r2,r3,r5-r7,r12}
              ldmia r0!,{r2,r3}
              stmia r1!,{r2,r3}
              mov r0,#6
              b recovery_a_shim
          EOF
          arm-none-eabi-as -mcpu=mpcore /tmp/recovery-a.s -o /tmp/recovery-a.o
          arm-none-eabi-objcopy -O binary -j .text /tmp/recovery-a.o /tmp/recovery-a.bin
          echo '=== recovery A shim ==='
          arm-none-eabi-objdump -d /tmp/recovery-a.o
          test "$(stat -c %s /tmp/recovery-a.bin)" -eq 32
