name: official-bank-recovery-a-armips-smoke

on:
  push:
    branches:
      - feature/official-bank-recovery-auto-rollback
  workflow_dispatch:

jobs:
  armips-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare synthetic verified-layout baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bank/rom/exefs | Out-Null
          New-Item -ItemType Directory -Force bank/build | Out-Null
          $path = 'bank/rom/exefs/00040000000C9B00.dec.code'
          $fs = [System.IO.File]::Open($path, [System.IO.FileMode]::Create)
          try { $fs.SetLength(0x2AC000) } finally { $fs.Dispose() }

      - name: Build tiny ARM ELF import stubs
        shell: pwsh
        run: |
          @'
          .syntax unified
          .cpu mpcore
          .thumb
          .text
          .thumb_func
          .global OfficialBulkSync_Process
          OfficialBulkSync_Process:
              bx lr
          '@ | Set-Content -Encoding ascii bank/build/bulk_stub.s

          @'
          .syntax unified
          .cpu mpcore
          .thumb
          .text
          .thumb_func
          .global OfficialRecovery_WalCase1
          OfficialRecovery_WalCase1:
              bx lr
          .thumb_func
          .global OfficialRecovery_WalSelectStatus
          OfficialRecovery_WalSelectStatus:
              bx lr
          .thumb_func
          .global OfficialRecovery_WalCase8Result
          OfficialRecovery_WalCase8Result:
              bx lr
          .thumb_func
          .global OfficialRecovery_WalLocalStatusA
          OfficialRecovery_WalLocalStatusA:
              bx lr
          '@ | Set-Content -Encoding ascii bank/build/wal_stub.s

          clang --target=arm-none-eabi -mcpu=mpcore -mthumb -c bank/build/bulk_stub.s -o bank/build/official_bulk_sync_prod.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang --target=arm-none-eabi -mcpu=mpcore -mthumb -c bank/build/wal_stub.s -o bank/build/official_recovery_wal_thumb.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble main_official.s with armips
        shell: pwsh
        working-directory: bank/src
        run: |
          ../tools/armips/armips.exe -erroronwarning -stat -sym ../build/official-armips-symbols-smoke.txt main_official.s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patched = '../build/00040000000C9B00.dec.code'
          if (-not (Test-Path $patched)) { throw 'armips did not create patched image' }
          if ((Get-Item $patched).Length -ne 0x2AC000) { throw 'patched image size changed' }

      - name: Verify linked symbols and production hook writes
        shell: pwsh
        run: |
          $text = Get-Content bank/build/official-armips-symbols-smoke.txt -Raw
          foreach ($name in @(
            'OfficialBulk_BankDataSyncDispatch',
            'OfficialRecovery_WalCase1',
            'OfficialRecovery_WalSelectStatus',
            'OfficialRecovery_WalCase8Result',
            'OfficialRecovery_WalLocalStatusA',
            'OfficialBulkSync_Process'
          )) {
            if ($text -notmatch [regex]::Escape($name)) { throw "missing symbol: $name" }
          }

          $bytes = [System.IO.File]::ReadAllBytes('bank/build/00040000000C9B00.dec.code')
          foreach ($va in @(0x002AF460,0x002B1DE4,0x002B1FFC,0x002B2090,0x002A8974)) {
            $off = $va - 0x00100000
            $word = [BitConverter]::ToUInt32($bytes,$off)
            if ($word -eq 0) { throw ('hook site remained zero at 0x{0:X8}' -f $va) }
          }
