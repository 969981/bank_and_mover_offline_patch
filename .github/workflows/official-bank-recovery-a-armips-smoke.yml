name: official-bank-recovery-a-armips-smoke

on:
  push:
    branches:
      - feature/official-bank-recovery-auto-rollback
  workflow_dispatch:

jobs:
  build-production-objects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile production ARM objects
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
          mkdir -p bank/build
          FLAGS='-std=c11 -Os -march=armv6k -mtune=mpcore -mthumb -mfloat-abi=soft -ffreestanding -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer -fno-common -ffunction-sections -fdata-sections -Wall -Wextra -Werror'
          arm-none-eabi-gcc $FLAGS -c bank/src/official_bulk_sync_prod.c -o bank/build/official_bulk_sync_prod.o
          arm-none-eabi-as -mcpu=mpcore bank/src/official_recovery_wal_thumb.s -o bank/build/official_recovery_wal_thumb.o
          arm-none-eabi-size bank/build/official_bulk_sync_prod.o bank/build/official_recovery_wal_thumb.o
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-a-production-objects
          path: |
            bank/build/official_bulk_sync_prod.o
            bank/build/official_recovery_wal_thumb.o
          if-no-files-found: error

  armips-smoke:
    needs: build-production-objects
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recovery-a-production-objects
          path: bank/build

      - name: Prepare synthetic verified-layout baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bank/rom/exefs | Out-Null
          $path = 'bank/rom/exefs/00040000000C9B00.dec.code'
          $fs = [System.IO.File]::Open($path, [System.IO.FileMode]::Create)
          try { $fs.SetLength(0x2AC000) } finally { $fs.Dispose() }

      - name: Assemble production main_official.s with armips
        shell: pwsh
        working-directory: bank/src
        run: |
          ../tools/armips/armips.exe -erroronwarning -stat -sym ../build/official-armips-symbols-smoke.txt main_official.s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patched = '../build/00040000000C9B00.dec.code'
          if (-not (Test-Path $patched)) { throw 'armips did not create patched image' }
          if ((Get-Item $patched).Length -ne 0x2AC000) { throw 'patched image size changed' }

      - name: Verify linked symbols and rollback production hooks
        shell: pwsh
        run: |
          $text = Get-Content bank/build/official-armips-symbols-smoke.txt -Raw
          foreach ($name in @(
            'OfficialBulk_BankDataSyncDispatch',
            'OfficialRecovery_WalCase1',
            'OfficialRecovery_WalCase5Status',
            'OfficialRecovery_WalCase8Result',
            'OfficialBulkSync_Process'
          )) {
            if ($text -notmatch [regex]::Escape($name)) { throw "missing symbol: $name" }
          }
          foreach ($removed in @('OfficialRecovery_WalSelectStatus','OfficialRecovery_WalLocalStatusA')) {
            if ($text -match [regex]::Escape($removed)) { throw "stale rollback symbol still linked: $removed" }
          }

          $bytes = [System.IO.File]::ReadAllBytes('bank/build/00040000000C9B00.dec.code')
          foreach ($va in @(0x002AF460,0x002B1DE4,0x002B1F50,0x002B2090)) {
            $off = $va - 0x00100000
            if ([BitConverter]::ToUInt32($bytes,$off) -eq 0) { throw ('hook site remained zero at 0x{0:X8}' -f $va) }
          }
          if ([BitConverter]::ToUInt32($bytes,0x002B1FFC-0x00100000) -ne 0) { throw 'unexpected case7 hook in A' }
          if ([BitConverter]::ToUInt32($bytes,0x002A8968-0x00100000) -ne 0) { throw 'unexpected state18 hook in A' }

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-a-linked-template
          path: |
            bank/build/00040000000C9B00.dec.code
            bank/build/official-armips-symbols-smoke.txt
          if-no-files-found: error
